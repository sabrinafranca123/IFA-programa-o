<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0F1A">
<title>IFA Lab · Código · Matéria · Energia</title>
<meta name="description" content="Uma jornada interativa pela metodologia IFA: Programação, Robótica e Física unidas por tecnologia assistiva.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<style>
/* ============================================================
   RESET + TOKENS
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070A12;
  --bg-2:#0B0F1A;
  --surface:rgba(20,26,46,.55);
  --surface-solid:#141A2E;
  --text:#E8EAF2;
  --text-dim:#8892AA;
  --line:rgba(255,255,255,.08);
  --purple:#8B5CFF;
  --purple-glow:rgba(139,92,255,.45);
  --teal:#00E0C4;
  --teal-glow:rgba(0,224,196,.4);
  --orange:#FF7A45;
  --yellow:#FFC000;
  --pink:#FF3D9A;

  --font-mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',sans-serif;

  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

html[data-theme="light"]{
  --bg:#F2EFE8;
  --bg-2:#EAE6FF;
  --surface:rgba(255,255,255,.7);
  --surface-solid:#FFFFFF;
  --text:#0A0E1A;
  --text-dim:#4B5563;
  --line:rgba(10,14,26,.08);
  --purple:#5B2CB8;
  --purple-glow:rgba(91,44,184,.35);
  --teal:#00897B;
  --teal-glow:rgba(0,137,123,.3);
  --orange:#D94F1E;
}

/* Modo alto contraste */
html[data-contrast="high"]{
  --text:#FFFFFF;
  --text-dim:#E0E0E0;
  --line:rgba(255,255,255,.4);
  --purple:#B79CFF;
  --teal:#4DFFE9;
}
html[data-theme="light"][data-contrast="high"]{
  --text:#000000;
  --text-dim:#000000;
  --line:rgba(0,0,0,.5);
  --purple:#3A0F8A;
  --teal:#005A4E;
}

/* Reduzir movimento */
html[data-motion="reduced"] *,
html[data-motion="reduced"] *::before,
html[data-motion="reduced"] *::after{
  animation-duration:.001ms !important;
  transition-duration:.001ms !important;
}

/* Fonte grande */
html[data-font="large"]{font-size:118%}

body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  cursor:none;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:none;border:none;background:none;color:inherit}
::selection{background:var(--purple);color:#fff}

/* ============================================================
   ACESSIBILIDADE
   ============================================================ */
:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:6px}
.skip{position:absolute;top:-100px;left:1rem;background:var(--teal);color:#000;padding:.8rem 1.2rem;border-radius:0 0 10px 10px;font-weight:800;z-index:9999;transition:top .3s}
.skip:focus{top:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ============================================================
   CURSOR MAGNÉTICO
   ============================================================ */
.cursor{
  position:fixed;top:0;left:0;pointer-events:none;z-index:9998;
  border-radius:50%;mix-blend-mode:difference;
  transition:width .3s var(--ease),height .3s var(--ease),background .3s;
  transform:translate(-50%,-50%);
}
.cursor-dot{width:6px;height:6px;background:#fff}
.cursor-ring{
  width:36px;height:36px;border:1.5px solid rgba(255,255,255,.6);
  background:transparent;
}
.cursor.hover{width:70px;height:70px;background:rgba(255,255,255,.15);border-color:transparent}
@media (hover:none),(pointer:coarse){
  body,button,a{cursor:auto}
  .cursor{display:none}
}

/* ============================================================
   HUD SUPERIOR (barra de progresso + nav)
   ============================================================ */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:900;
  display:flex;justify-content:space-between;align-items:center;
  padding:1rem 1.5rem;
  font-family:var(--font-mono);font-size:.72rem;
  color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.hud-left{display:flex;align-items:center;gap:1rem}
.hud-brand{
  display:flex;align-items:center;gap:.5rem;
  font-weight:800;font-size:.85rem;color:var(--text);
  font-family:var(--font-display);letter-spacing:1px;
}
.hud-brand .pulse{
  width:8px;height:8px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 12px var(--teal);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

.hud-right{display:flex;gap:.5rem;align-items:center}
.hud-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);font-size:1rem;
  transition:all .3s var(--ease);
}
.hud-btn:hover{transform:translateY(-2px);border-color:var(--purple);color:var(--purple)}

#progressBar{
  position:fixed;top:0;left:0;height:2px;width:0%;
  background:linear-gradient(90deg,var(--purple),var(--teal),var(--orange),var(--yellow));
  z-index:950;transition:width .1s linear;
  box-shadow:0 0 14px var(--purple-glow);
}

/* ============================================================
   CANVAS FUNDO — REDE NEURAL
   ============================================================ */
#neural{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:0;pointer-events:none;opacity:.7;
}

/* ============================================================
   HERO CINEMATOGRÁFICO
   ============================================================ */
.hero{
  position:relative;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:8rem 6vw 4rem;
  z-index:1;
  overflow:hidden;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:.6rem;
  font-family:var(--font-mono);font-size:.75rem;
  color:var(--teal);letter-spacing:3px;text-transform:uppercase;
  margin-bottom:2rem;
  opacity:0;animation:fadeUp .8s .2s var(--ease) forwards;
}
.hero-eyebrow .line{
  width:40px;height:1px;background:var(--teal);
  animation:grow 1s .5s var(--ease) forwards;transform-origin:left;transform:scaleX(0);
}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.hero h1{
  font-family:var(--font-display);
  font-size:clamp(2.5rem,9vw,7rem);
  line-height:.95;letter-spacing:-.04em;
  font-weight:700;max-width:14ch;
  margin-bottom:2rem;
}
.hero h1 .word{
  display:inline-block;
  opacity:0;transform:translateY(60px) rotateX(-40deg);
  animation:wordIn 1s var(--ease-out) forwards;
  transform-origin:bottom;
}
.hero h1 .word:nth-child(1){animation-delay:.3s}
.hero h1 .word:nth-child(2){animation-delay:.45s}
.hero h1 .word:nth-child(3){animation-delay:.6s}
.hero h1 .word:nth-child(4){animation-delay:.75s}
.hero h1 .accent{
  background:linear-gradient(120deg,var(--purple),var(--teal),var(--orange));
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradient 6s ease infinite;
}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes wordIn{to{opacity:1;transform:translateY(0) rotateX(0)}}

.hero-sub{
  font-family:var(--font-mono);font-size:clamp(.9rem,1.4vw,1.05rem);
  color:var(--text-dim);max-width:60ch;margin-bottom:3rem;
  opacity:0;animation:fadeUp 1s 1s var(--ease) forwards;
}
.hero-sub .prompt{color:var(--teal)}

.hero-cta{
  display:flex;gap:1rem;flex-wrap:wrap;
  opacity:0;animation:fadeUp 1s 1.2s var(--ease) forwards;
}
.btn{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:1rem 1.8rem;border-radius:100px;
  font-weight:700;font-size:.9rem;
  font-family:var(--font-mono);letter-spacing:.5px;
  transition:all .4s var(--ease);
  position:relative;overflow:hidden;
}
.btn-primary{
  background:var(--text);color:var(--bg);
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(255,255,255,.15)}
.btn-primary::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,var(--purple),var(--teal));
  transform:translateX(-100%);transition:transform .5s var(--ease);
  z-index:-1;
}
.btn-primary:hover{color:#fff}
.btn-primary:hover::before{transform:translateX(0)}
.btn-primary span{position:relative;z-index:1}

.btn-ghost{
  border:1px solid var(--line);color:var(--text);
  background:var(--surface);backdrop-filter:blur(10px);
}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-3px)}

/* Coordenadas HUD canto */
.hud-corner{
  position:fixed;bottom:1.5rem;left:1.5rem;z-index:100;
  font-family:var(--font-mono);font-size:.68rem;
  color:var(--text-dim);letter-spacing:1px;
  line-height:1.8;text-transform:uppercase;
  pointer-events:none;
}
.hud-corner .val{color:var(--teal)}

/* ============================================================
   SEÇÃO PILARES — SCROLL HORIZONTAL FIXADO
   ============================================================ */
.pillars-section{
  position:relative;z-index:1;
  height:400vh; /* 3 pilares + intro */
}
.pillars-sticky{
  position:sticky;top:0;height:100vh;
  display:flex;align-items:center;
  overflow:hidden;
}
.pillars-track{
  display:flex;gap:6vw;
  padding:0 8vw;
  will-change:transform;
  transition:transform .1s linear;
}
.pillar-slide{
  flex:0 0 70vw;max-width:900px;
  display:grid;grid-template-columns:1fr 1fr;gap:4vw;
  align-items:center;
}
@media (max-width:900px){
  .pillar-slide{flex:0 0 88vw;grid-template-columns:1fr;gap:2rem}
}

.pillar-visual{
  position:relative;aspect-ratio:4/5;
  border-radius:24px;overflow:hidden;
  border:1px solid var(--line);
  background:var(--surface);
}
.pillar-visual img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(.4) contrast(1.1);
  transition:filter .6s var(--ease),transform .8s var(--ease);
}
.pillar-slide:hover .pillar-visual img{filter:grayscale(0);transform:scale(1.05)}
.pillar-visual::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(7,10,18,.9));
}
.pillar-visual .badge{
  position:absolute;top:1.5rem;left:1.5rem;z-index:2;
  font-family:var(--font-mono);font-size:.7rem;
  padding:.5rem .9rem;border-radius:100px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;letter-spacing:2px;text-transform:uppercase;
}

.pillar-info h3{
  font-family:var(--font-display);
  font-size:clamp(2rem,4.5vw,3.5rem);
  line-height:1;letter-spacing:-.03em;
  margin-bottom:1.2rem;font-weight:700;
}
.pillar-info .num{
  font-family:var(--font-mono);font-size:.85rem;
  color:var(--teal);letter-spacing:3px;
  display:block;margin-bottom:1rem;
}
.pillar-info p{
  color:var(--text-dim);font-size:1.05rem;
  max-width:45ch;margin-bottom:2rem;
}
.pillar-info .tags{display:flex;flex-wrap:wrap;gap:.5rem}
.pillar-info .tag{
  font-family:var(--font-mono);font-size:.72rem;
  padding:.4rem .8rem;border-radius:100px;
  border:1px solid var(--line);color:var(--text-dim);
  letter-spacing:1px;
}
.pillar-info .tag.on{border-color:var(--teal);color:var(--teal)}

/* Cores por pilar */
.pillar-slide[data-color="purple"] .num{color:var(--purple)}
.pillar-slide[data-color="purple"] .tag.on{border-color:var(--purple);color:var(--purple)}
.pillar-slide[data-color="teal"] .num{color:var(--teal)}
.pillar-slide[data-color="teal"] .tag.on{border-color:var(--teal);color:var(--teal)}
.pillar-slide[data-color="orange"] .num{color:var(--orange)}
.pillar-slide[data-color="orange"] .tag.on{border-color:var(--orange);color:var(--orange)}

/* Indicador vertical */
.pillars-indicator{
  position:absolute;right:2rem;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:.8rem;z-index:5;
}
.pillars-indicator .dot{
  width:6px;height:6px;border-radius:50%;background:var(--line);
  transition:all .4s var(--ease);cursor:none;
}
.pillars-indicator .dot.active{background:var(--teal);height:24px;border-radius:4px}
@media (max-width:600px){.pillars-indicator{display:none}}

/* ============================================================
   TERMINAL INTERATIVO
   ============================================================ */
.terminal-section{
  position:relative;z-index:1;
  padding:8rem 6vw;
}
.terminal-wrap{
  max-width:900px;margin:0 auto;
  border-radius:16px;overflow:hidden;
  border:1px solid var(--line);
  background:rgba(7,10,18,.85);
  backdrop-filter:blur(20px);
  box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 0 1px rgba(139,92,255,.15);
}
.terminal-bar{
  display:flex;align-items:center;gap:.6rem;
  padding:.9rem 1.2rem;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid var(--line);
}
.terminal-bar .dot{width:12px;height:12px;border-radius:50%}
.terminal-bar .dot:nth-child(1){background:#FF5F56}
.terminal-bar .dot:nth-child(2){background:#FFBD2E}
.terminal-bar .dot:nth-child(3){background:#27C93F}
.terminal-bar .title{
  margin-left:auto;font-family:var(--font-mono);
  font-size:.72rem;color:var(--text-dim);letter-spacing:1px;
}
.terminal-body{
  padding:1.8rem;
  font-family:var(--font-mono);font-size:.88rem;
  color:#D8DEE9;line-height:1.8;
  min-height:340px;max-height:400px;overflow-y:auto;
}
.terminal-body::-webkit-scrollbar{width:8px}
.terminal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

.t-line{margin-bottom:.4rem;word-wrap:break-word}
.t-prompt{color:var(--teal);font-weight:700}
.t-cmd{color:#fff}
.t-out{color:#8892AA}
.t-ok{color:#4DFFE9}
.t-warn{color:var(--yellow)}
.t-err{color:#FF5F56}
.t-accent{color:var(--purple)}

.t-input-line{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.t-input{
  flex:1;background:transparent;border:none;outline:none;
  color:#fff;font-family:var(--font-mono);font-size:.88rem;cursor:none;
}

/* ============================================================
   BENTO GRID — GALERIA
   ============================================================ */
.bento-section{
  position:relative;z-index:1;
  padding:8rem 6vw;
}
.bento-head{
  max-width:800px;margin:0 auto 4rem;text-align:center;
}
.bento-head .kicker{
  font-family:var(--font-mono);font-size:.72rem;
  color:var(--teal);letter-spacing:3px;text-transform:uppercase;
  margin-bottom:1rem;
}
.bento-head h2{
  font-family:var(--font-display);
  font-size:clamp(2rem,5vw,3.4rem);
  letter-spacing:-.03em;line-height:1;font-weight:700;
}
.bento-head h2 .accent{color:var(--purple)}

.bento{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-auto-rows:180px;
  gap:1rem;
  max-width:1300px;margin:0 auto;
}
.bento-item{
  position:relative;overflow:hidden;
  border-radius:18px;border:1px solid var(--line);
  background:var(--surface);
  transition:transform .5s var(--ease),border-color .3s;
  cursor:none;
}
.bento-item:hover{transform:scale(1.02);border-color:var(--purple)}
.bento-item img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .8s var(--ease),filter .4s;
  filter:grayscale(.3);
}
.bento-item:hover img{transform:scale(1.08);filter:grayscale(0)}
.bento-item .overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,rgba(7,10,18,.95));
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:1.4rem;opacity:0;transform:translateY(10px);
  transition:all .4s var(--ease);
}
.bento-item:hover .overlay{opacity:1;transform:translateY(0)}
.bento-item .overlay h4{
  font-family:var(--font-display);font-size:1rem;
  margin-bottom:.3rem;color:#fff;
}
.bento-item .overlay p{
  font-family:var(--font-mono);font-size:.72rem;
  color:#A9B2C5;letter-spacing:.5px;
}
.bento-item .corner{
  position:absolute;top:1rem;right:1rem;
  font-family:var(--font-mono);font-size:.68rem;
  padding:.3rem .6rem;border-radius:6px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(10px);
  color:var(--teal);letter-spacing:1px;z-index:2;
}

/* Variações de tamanho */
.bento-item.a{grid-column:span 3;grid-row:span 2}
.bento-item.b{grid-column:span 3;grid-row:span 1}
.bento-item.c{grid-column:span 3;grid-row:span 1}
.bento-item.d{grid-column:span 2;grid-row:span 1}
.bento-item.e{grid-column:span 2;grid-row:span 1}
.bento-item.f{grid-column:span 2;grid-row:span 1}

@media (max-width:800px){
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:200px}
  .bento-item.a{grid-column:span 2;grid-row:span 2}
  .bento-item.b,.bento-item.c,.bento-item.d,.bento-item.e,.bento-item.f{grid-column:span 1;grid-row:span 1}
}
@media (max-width:500px){
  .bento{grid-template-columns:1fr}
  .bento-item.a,.bento-item.b,.bento-item.c,.bento-item.d,.bento-item.e,.bento-item.f{grid-column:span 1;grid-row:span 1}
}

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline-section{
  position:relative;z-index:1;
  padding:8rem 6vw;
}
.timeline{
  max-width:900px;margin:0 auto;position:relative;
  padding-left:2rem;
}
.timeline::before{
  content:"";position:absolute;left:0;top:0;bottom:0;
  width:2px;background:linear-gradient(180deg,var(--purple),var(--teal),var(--orange));
  opacity:.4;
}
.tl-item{
  position:relative;padding:0 0 3rem 2rem;
  opacity:0;transform:translateX(-20px);
  transition:all .8s var(--ease);
}
.tl-item.visible{opacity:1;transform:translateX(0)}
.tl-item::before{
  content:"";position:absolute;left:-2.35rem;top:.4rem;
  width:14px;height:14px;border-radius:50%;
  background:var(--bg);border:2px solid var(--teal);
  box-shadow:0 0 0 4px rgba(0,224,196,.15);
}
.tl-year{
  font-family:var(--font-mono);font-size:.78rem;
  color:var(--teal);letter-spacing:2px;margin-bottom:.5rem;
}
.tl-item h3{
  font-family:var(--font-display);font-size:1.4rem;
  margin-bottom:.4rem;letter-spacing:-.02em;
}
.tl-item p{color:var(--text-dim);font-size:.95rem;max-width:55ch}

/* ============================================================
   CTA + FOOTER
   ============================================================ */
.cta-final{
  position:relative;z-index:1;
  padding:8rem 6vw;text-align:center;
}
.cta-final h2{
  font-family:var(--font-display);
  font-size:clamp(2.5rem,7vw,5rem);
  line-height:.95;letter-spacing:-.04em;
  margin-bottom:1.5rem;font-weight:700;max-width:16ch;margin-inline:auto;
}
.cta-final h2 .accent{
  background:linear-gradient(120deg,var(--purple),var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cta-final p{color:var(--text-dim);max-width:50ch;margin:0 auto 2.5rem;font-size:1.05rem}

footer{
  position:relative;z-index:1;
  padding:4rem 6vw 2rem;
  border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:.78rem;
  color:var(--text-dim);
}
.footer-grid{
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr;
  gap:2rem;max-width:1300px;margin:0 auto 3rem;
}
@media (max-width:800px){.footer-grid{grid-template-columns:1fr 1fr}}
@media (max-width:500px){.footer-grid{grid-template-columns:1fr}}
.footer-col h4{
  color:var(--text);font-size:.75rem;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:1rem;
}
.footer-col a{display:block;padding:.3rem 0;transition:color .2s}
.footer-col a:hover{color:var(--teal)}
.footer-bottom{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;
  max-width:1300px;margin:0 auto;
  padding-top:2rem;border-top:1px solid var(--line);
  font-size:.72rem;letter-spacing:1px;
}

/* ============================================================
   PAINEL DE ACESSIBILIDADE
   ============================================================ */
.a11y-panel{
  position:fixed;top:4.5rem;right:1.5rem;z-index:1000;
  width:280px;
  background:var(--surface-solid);
  border:1px solid var(--line);
  border-radius:16px;
  padding:1.4rem;
  box-shadow:0 30px 60px rgba(0,0,0,.4);
  transform:translateY(-10px) scale(.96);
  opacity:0;pointer-events:none;
  transition:all .35s var(--ease);
}
.a11y-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.a11y-panel h4{
  font-family:var(--font-mono);font-size:.75rem;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:1rem;
}
.a11y-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:.7rem 0;border-bottom:1px solid var(--line);
  font-size:.85rem;
}
.a11y-row:last-child{border-bottom:none}
.a11y-toggle{
  width:44px;height:24px;border-radius:100px;
  background:var(--line);position:relative;
  transition:background .3s;
}
.a11y-toggle::after{
  content:"";position:absolute;top:2px;left:2px;
  width:20px;height:20px;border-radius:50%;
  background:var(--text);transition:transform .3s var(--ease);
}
.a11y-toggle.on{background:var(--teal)}
.a11y-toggle.on::after{transform:translateX(20px);background:#fff}

/* Botão voltar topo */
#toTop{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:800;
  width:48px;height:48px;border-radius:50%;
  background:var(--surface-solid);border:1px solid var(--line);
  color:var(--text);font-size:1.1rem;
  display:grid;place-items:center;
  opacity:0;transform:translateY(20px);pointer-events:none;
  transition:all .35s var(--ease);
  backdrop-filter:blur(10px);
}
#toTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
#toTop:hover{transform:translateY(-4px);border-color:var(--teal);color:var(--teal)}

/* Noise texture overlay sutil */
.noise{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}

/* Scanlines sutis (identidade de laboratório) */
.scanlines{
  position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.03;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.6) 0px,rgba(255,255,255,.6) 1px,transparent 1px,transparent 3px);
}

@media (prefers-reduced-motion:reduce){
  .noise,.scanlines{display:none}
}
